<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Registration | Fábula Dental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/user-views.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body class="bg-light">

    <header>
        <h1>Fábula Dental</h1>
        <p class="m-0">Specialists in Children's Smiles</p>
    </header>

    <main class="form-container">
        <div class="form-card shadow-sm">
            <h2 class="text-primary fw-bold">Register New Payment</h2>

            <form action="../../controllers/payment-controller.php" method="POST" id="paymentForm">
                <input type="hidden" name="action" value="create">
                <div class="form-grid">

                    <div class="input-group full-width">
                        <label for="patientID">Patient ID Number</label>
                        <input type="text" id="patientID" name="patientID" required pattern="[0-9]{10}" placeholder="e.g. 1727095414">
                    </div>

                    <div class="input-group">
                        <label for="amount">Payment Amount ($)</label>
                        <input type="number" id="amount" name="amount" required min="0.01" step="0.01" placeholder="e.g. 50.00">
                    </div>

                    <div class="input-group">
                        <label for="date">Payment Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="input-group">
                        <label for="paymentType">Payment Type</label>
                        <select id="paymentType" name="paymentType" required>
                            <option value="">Select type</option>
                            <option value="Deposit">Deposit</option>
                            <option value="Final">Final Payment</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="paymentMethod">Payment Method</label>
                        <select id="paymentMethod" name="paymentMethod" required>
                            <option value="">Select method</option>
                            <option value="Cash">Cash</option>
                            <option value="Transfer">Transfer</option>
                            <option value="Card">Credit/Debit Card</option>
                        </select>
                    </div>

                    <div class="full-width mt-3">
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Register Transaction</button>
                    </div>

                    <div class="full-width actions-row d-flex gap-2 mt-2">
                        <a href="../php/payment-list.php" class="btn btn-secondary flex-grow-1">View History</a>
                        <a href="./receptionist.html" class="btn btn-secondary flex-grow-1">Back to Dashboard</a>
                    </div>

                </div>
            </form>
        </div>
    </main>

    <footer class="text-center py-3">
        <p class="text-muted small">&copy; 2026 Fábula Dental - Specialized Pediatric Dentistry.</p>
    </footer>

    <script src="../js/payment-validation.js"></script>
</body>

</html>
