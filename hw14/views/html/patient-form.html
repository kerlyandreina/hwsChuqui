<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | Fábula Dental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/user-views.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body class="bg-light">
    <header class="bg-primary text-white shadow-sm">
        <h1 class="m-0 text-center py-3">Patient Registration - Dental Area</h1>
    </header>

    <main class="form-container">
        <div class="form-card shadow-sm">
            <h2 class="text-primary fw-bold mb-4">Personal Data Entry</h2>

            <form action="../../controllers/patient-controller.php" method="POST" id="patientForm">
                <input type="hidden" name="action" value="create">
                <div class="form-grid">

                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required minlength="3" placeholder="e.g. John Smith">
                    </div>

                    <div class="input-group">
                        <label for="patientID">ID Number</label>
                        <input type="text" id="patientID" name="patientID" required pattern="[0-9]{10}" placeholder="1727095414">
                    </div>

                    <div class="input-group">
                        <label for="birthday">Date of Birth</label>
                        <input type="date" id="birthday" name="birthday" min="1900-01-01" max="2026-05-05" required>
                    </div>

                    <div class="input-group">
                        <label for="phone">Contact Phone</label>
                        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="0991234567">
                    </div>

                    <div class="input-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select</option>
                            <option value="femenino">Female</option>
                            <option value="masculino">Male</option>
                            <option value="otro">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="legalRepresentative">Legal Representative (Optional)</label>
                        <input type="text" id="legalRepresentative" name="legalRepresentative" placeholder="Required if patient is a minor">
                    </div>

                    <div class="input-group full-width">
                        <label for="reasonForConsultation">Reason for Consultation</label>
                        <input type="text" id="reasonForConsultation" name="reasonForConsultation" required minlength="5" placeholder="e.g. Pain in lower right molar">
                    </div>

                    <div class="full-width mt-3">
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Save Medical Record</button>
                    </div>

                    <div class="full-width d-flex gap-2 mt-2">
                        <a href="../php/patient-list.php" class="btn btn-secondary flex-grow-1">View List</a>
                        <a href="./dentist.html" class="btn btn-secondary flex-grow-1">Back to Dashboard</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/patient-validation.js"></script>
</body>

</html>
